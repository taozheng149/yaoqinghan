<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>邀请函</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    color: #fff;
    background: radial-gradient(circle at 50% 30%, #4a0e14 0%, #2d0610 45%, #1a0208 100%);
    position: relative;
  }

  /* 背景装饰层 */
  .bg-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .lantern {
    position: absolute;
    top: -20px;
    width: 90px;
    height: 110px;
    background: radial-gradient(circle at 50% 40%, #ff4d4d 0%, #c12026 60%, #7a0a0f 100%);
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(255, 80, 80, 0.55);
    animation: swing 4s ease-in-out infinite;
  }

  .lantern::before {
    content: "";
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 18px;
    background: #ffd447;
  }

  .lantern::after {
    content: "";
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 10px;
    background: #ffd447;
    border-radius: 3px;
  }

  .lantern.left { left: 18px; animation-delay: 0s; }
  .lantern.right { right: 18px; animation-delay: 1.2s; }

  .balloon {
    position: absolute;
    width: 46px;
    height: 58px;
    border-radius: 50%;
    box-shadow: inset -8px -10px 18px rgba(0, 0, 0, 0.25);
    animation: float 7s ease-in-out infinite;
  }

  .balloon::after {
    content: "";
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    height: 14px;
    background: rgba(255, 255, 255, 0.45);
  }

  .balloon.b1 { background: #ffd447; top: 18%; left: 8%; animation-delay: 0s; }
  .balloon.b2 { background: #ff4d4d; top: 12%; right: 10%; animation-delay: 1.4s; }
  .balloon.b3 { background: #ff9ec7; top: 72%; left: 6%; animation-delay: 2.1s; }
  .balloon.b4 { background: #ffd447; top: 78%; right: 8%; animation-delay: 0.6s; }

  .star {
    position: absolute;
    background: #ffd447;
    clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    animation: twinkle 3s ease-in-out infinite;
  }

  .star.s1 { width: 14px; height: 14px; top: 26%; left: 14%; animation-delay: 0s; }
  .star.s2 { width: 10px; height: 10px; top: 34%; right: 16%; animation-delay: 0.7s; }
  .star.s3 { width: 12px; height: 12px; top: 64%; left: 11%; animation-delay: 1.3s; }
  .star.s4 { width: 16px; height: 16px; top: 70%; right: 14%; animation-delay: 1.9s; }
  .star.s5 { width: 10px; height: 10px; top: 48%; left: 50%; animation-delay: 0.4s; }

  .confetti {
    position: absolute;
    width: 6px;
    height: 10px;
    border-radius: 2px;
    opacity: 0.85;
    animation: fall linear infinite;
  }

  .c1 { background: #ffd447; top: -20%; left: 20%; animation-duration: 9s; animation-delay: 0s; }
  .c2 { background: #ff4d4d; top: -20%; left: 40%; animation-duration: 11s; animation-delay: 2s; }
  .c3 { background: #ff9ec7; top: -20%; left: 60%; animation-duration: 10s; animation-delay: 4s; }
  .c4 { background: #ffffff; top: -20%; left: 80%; animation-duration: 12s; animation-delay: 1s; }
  .c5 { background: #ffd447; top: -20%; left: 30%; animation-duration: 13s; animation-delay: 3s; }
  .c6 { background: #ff4d4d; top: -20%; left: 70%; animation-duration: 8s; animation-delay: 5s; }

  /* 内容区 */
  .invite-box {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 28px;
    text-align: center;
  }

  .top-label {
    font-size: 13px;
    letter-spacing: 4px;
    color: #ffd447;
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeUp 1.2s ease 0.2s forwards;
  }

  .main-title {
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 44px;
    font-weight: bold;
    letter-spacing: 10px;
    color: #ffd447;
    text-shadow:
      0 0 10px rgba(255, 212, 71, 0.55),
      0 0 24px rgba(255, 120, 120, 0.35),
      0 4px 12px rgba(0, 0, 0, 0.45);
    margin-bottom: 18px;
    opacity: 0;
    animation: fadeUp 1.4s ease 0.4s forwards;
  }

  .english-sub {
    font-size: 12px;
    letter-spacing: 5px;
    color: rgba(255, 255, 255, 0.65);
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 1.2s ease 0.6s forwards;
  }

  .divider {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #ffd447, transparent);
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeIn 1.4s ease 0.8s forwards;
  }

  .greeting {
    font-size: 17px;
    color: #fff;
    margin-bottom: 16px;
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeUp 1.2s ease 1s forwards;
  }

  .text-line {
    font-size: 15px;
    line-height: 2;
    color: rgba(255, 255, 255, 0.88);
    letter-spacing: 1px;
    opacity: 0;
    transform: translateY(14px);
  }

  .text-line.l1 { animation: fadeUp 1.1s ease 1.2s forwards; }
  .text-line.l2 { animation: fadeUp 1.1s ease 1.35s forwards; }
  .text-line.l3 { animation: fadeUp 1.1s ease 1.5s forwards; }
  .text-line.l4 { animation: fadeUp 1.1s ease 1.65s forwards; }
  .text-line.l5 { animation: fadeUp 1.1s ease 1.8s forwards; }

  .happy-badge {
    margin-top: 20px;
    padding: 9px 18px;
    border: 1px solid #ffd447;
    border-radius: 24px;
    font-size: 16px;
    color: #ffd447;
    letter-spacing: 3px;
    background: rgba(255, 212, 71, 0.08);
    opacity: 0;
    animation: fadeUp 1.2s ease 2s forwards;
  }

  .info-card {
    margin-top: 22px;
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 212, 71, 0.35);
    border-radius: 14px;
    opacity: 0;
    animation: fadeUp 1.3s ease 2.2s forwards;
  }

  .info-item {
    font-size: 15px;
    line-height: 2;
    color: #fff;
    letter-spacing: 1px;
  }

  .inviter {
    position: absolute;
    bottom: 40px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.72);
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeIn 1.4s ease 2.5s forwards;
  }

  /* 动画 */
  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(16px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes swing {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  @keyframes fall {
    0% { transform: translateY(0) rotate(0); opacity: 0; }
    10% { opacity: 0.9; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* 小屏适配 */
  @media (max-width: 360px) {
    .main-title { font-size: 38px; letter-spacing: 8px; }
    .text-line { font-size: 14px; }
    .info-item { font-size: 14px; }
  }
</style>
</head>

<body>
  <!-- 背景装饰 -->
  <div class="bg-layer">
    <div class="lantern left"></div>
    <div class="lantern right"></div>

    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>

    <div class="star s1"></div>
    <div class="star s2"></div>
    <div class="star s3"></div>
    <div class="star s4"></div>
    <div class="star s5"></div>

    <div class="confetti c1"></div>
    <div class="confetti c2"></div>
    <div class="confetti c3"></div>
    <div class="confetti c4"></div>
    <div class="confetti c5"></div>
    <div class="confetti c6"></div>
  </div>

  <!-- 邀请函内容 -->
  <div class="invite-box">
    <div class="top-label">生日邀请</div>
    <div class="main-title">二十四岁之喜</div>
    <div class="english-sub">SINCERE INVITATION</div>

    <div class="divider"></div>

    <div class="greeting">🏰 尊敬的各位长辈、亲友：</div>

    <div class="text-line l1">✨ 承蒙时光眷顾，迎来二十四岁之喜</div>
    <div class="text-line l2">✨ 感恩一路有您的关照与惦念，情谊长存于心</div>
    <div class="text-line l3">✨ 谨备薄酌，答谢厚爱</div>
    <div class="text-line l4">✨ 诚邀您携家人莅临</div>
    <div class="text-line l5">✨ 相聚言欢，共贺此辰</div>

    <div class="happy-badge">💛 恭盼光临</div>

    <div class="info-card">
      <div class="info-item">⏰ 时间：2026年09月20日 星期日 下午19点</div>
      <div class="info-item">🏠 地点：______________（请填写）</div>
    </div>

    <div class="inviter">💌 我-彭于晏 & 花-刘亦菲 敬邀</div>
  </div>
</body>
</html>
